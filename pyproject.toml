[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-screener-cli"
version = "0.2.0"
description = "Staged, rate-limited command-line runner for stock screeners"
requires-python = ">=3.10"

[project.scripts]
meta-screener = "meta_screener_cli:main"

[tool.setuptools]
py-modules = ["meta_screener_cli"]
